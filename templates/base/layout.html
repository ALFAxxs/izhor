<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Izhor{% endblock %} — Merchant Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --pink:#c2185b; --pink-l:#f8bbd0; --dark:#1a0a14;
  --card:#2a1020; --border:rgba(255,150,170,0.15);
  --text:#f0e0e8; --muted:rgba(240,224,232,0.5);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:rgba(255,255,255,0.03);border-right:0.5px solid var(--border);display:flex;flex-direction:column;padding:24px 0;z-index:100;}
.logo{padding:0 24px 24px;font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--pink-l);border-bottom:0.5px solid var(--border);}
.logo span{font-size:11px;display:block;letter-spacing:3px;color:var(--muted);margin-top:2px;font-family:'Inter',sans-serif;font-style:normal;}
nav{padding:16px 12px;flex:1;}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);font-size:14px;text-decoration:none;margin-bottom:2px;transition:background 0.2s,color 0.2s;}
nav a:hover,nav a.active{background:rgba(194,24,91,0.15);color:var(--pink-l);}
nav a svg{width:18px;height:18px;opacity:0.7;}
.sidebar-bottom{padding:16px 24px;border-top:0.5px solid var(--border);font-size:12px;color:var(--muted);}
.main{margin-left:220px;padding:32px;min-height:100vh;}
.page-title{font-size:22px;font-weight:500;margin-bottom:24px;}
.page-title small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{background:rgba(255,255,255,0.04);border:0.5px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.stat-card .num{font-size:28px;font-weight:600;color:var(--pink-l);}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0.5px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s;text-decoration:none;}
.btn-primary{background:var(--pink);color:#fff;}.btn-primary:hover{background:#ad1457;}
.btn-outline{background:transparent;color:var(--pink-l);border:0.5px solid var(--border);}.btn-outline:hover{background:rgba(194,24,91,0.1);}
.btn-sm{padding:6px 12px;font-size:13px;}
.btn-danger{background:rgba(220,50,50,0.15);color:#ff8080;border:0.5px solid rgba(220,50,50,0.2);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0.5px;border-bottom:0.5px solid var(--border);}
td{padding:12px;border-bottom:0.5px solid rgba(255,150,170,0.07);vertical-align:middle;}
tr:hover td{background:rgba(255,255,255,0.02);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-green{background:rgba(50,200,100,0.12);color:#5edb8a;}
.badge-gray{background:rgba(150,150,150,0.12);color:#aaa;}
.badge-pink{background:rgba(194,24,91,0.12);color:var(--pink-l);}
.form-group{margin-bottom:16px;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;background:rgba(255,255,255,0.05);border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border 0.2s;}
input:focus,select:focus,textarea:focus{border-color:rgba(194,24,91,0.5);}
select option{background:#2a1020;}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;}
.alert-error{background:rgba(220,50,50,0.1);border:0.5px solid rgba(220,50,50,0.2);color:#ff8080;}
.alert-success{background:rgba(50,200,100,0.1);border:0.5px solid rgba(50,200,100,0.2);color:#5edb8a;}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<aside class="sidebar">
  <div class="logo">Izhor <span>MERCHANT PANEL</span></div>
  <nav>
    <a href="/dashboard/" class="{% block nav_home %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="/dashboard/templates/" class="{% block nav_templates %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Shablonlar
    </a>
    <a href="/dashboard/qrcodes/" class="{% block nav_qr %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M17 14v3h3M14 17h3"/></svg>
      QR Kodlar
    </a>
    <a href="/dashboard/analytics/" class="{% block nav_analytics %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 20l4-8 4 4 4-6 4 4"/></svg>
      Analytics
    </a>
  </nav>
  <div class="sidebar-bottom">
    <div style="margin-bottom:8px;color:var(--text);font-size:13px;" id="sidebarUser"></div>
    <a href="/auth/logout/" style="color:var(--muted);font-size:12px;text-decoration:none;">Chiqish →</a>
  </div>
</aside>
<main class="main">{% block content %}{% endblock %}</main>
<script>
fetch('/api/auth/me/').then(r=>r.json()).then(d=>{
  const el=document.getElementById('sidebarUser');
  if(el) el.textContent=d.shop_name||d.username;
}).catch(()=>{});
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
