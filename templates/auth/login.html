<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izhor — Kirish</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#1a0a14,#2d0a1e);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#f0e0e8;}
.box{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,150,170,0.2);border-radius:16px;padding:40px;width:100%;max-width:380px;}
.logo{font-family:'Playfair Display',serif;font-style:italic;font-size:32px;color:#f8bbd0;text-align:center;margin-bottom:6px;}
.sub{text-align:center;font-size:12px;letter-spacing:3px;color:rgba(240,224,232,0.4);margin-bottom:32px;}
label{display:block;font-size:13px;color:rgba(240,224,232,0.5);margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,150,170,0.2);border-radius:8px;padding:11px 14px;color:#f0e0e8;font-size:14px;outline:none;margin-bottom:16px;transition:border 0.2s;}
input:focus{border-color:rgba(194,24,91,0.6);}
button{width:100%;background:#c2185b;color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:500;cursor:pointer;transition:background 0.2s;}
button:hover{background:#ad1457;}
.error{background:rgba(220,50,50,0.1);border:0.5px solid rgba(220,50,50,0.3);color:#ff8080;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Izhor</div>
  <div class="sub">MERCHANT PANEL</div>
  <div class="error" id="err"></div>
  <label>Login</label>
  <input type="text" id="username" placeholder="username">
  <label>Parol</label>
  <input type="password" id="password" placeholder="••••••••">
  <button onclick="doLogin()">Kirish</button>
</div>
<script>
function getCookie(name){
  let v=document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
  return v?v.pop():'';
}
async function doLogin(){
  const err=document.getElementById('err');
  err.style.display='none';
  const res=await fetch('/api/auth/login/',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})
  });
  const data=await res.json();
  if(res.ok){ window.location='/dashboard/'; }
  else{ err.textContent=data.non_field_errors?.[0]||'Xatolik yuz berdi.'; err.style.display='block'; }
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
